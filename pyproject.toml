[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "agent-creator-toolbox"
version = "0.1.0"
description = "Local-first capability discovery and execution routing for agents."
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0",
  "jsonschema>=4.23",
  "Pillow>=12.3,<13",
  "ImageHash>=4.3,<5",
  "opencv-python-headless>=5.0,<6",
]

[project.optional-dependencies]
tts-examples = ["pyttsx3>=2.90"]
local-vision = ["torch>=2.7", "transformers>=4.41,<4.50", "huggingface-hub>=0.27", "safetensors>=0.5", "einops>=0.8", "timm>=1.0"]
mesh-validation = ["trimesh>=4,<5"]

[project.scripts]
toolbox = "toolbox.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["toolbox"]

[tool.pytest.ini_options]
testpaths = ["tests"]
