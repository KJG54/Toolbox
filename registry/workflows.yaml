workflows:
  - id: normalize-media
    name: Normalize local media
    steps:
      - capability: normalize_media
        tool: ffmpeg
        output: portable_local_derivative
      - capability: create_provenance_record
        output: provenance_sidecar
  - id: watch-review
    name: Review local video with Watch
    steps:
      - capability: normalize_media
        tool: ffmpeg
        optional: true
        output: portable_local_derivative
      - capability: watch_video
        tool: watch-skill
        output: local_frames_and_transcript
      - capability: create_evidence_timeline
        tool: watch-skill
        output: versioned_evidence_timeline
      - capability: create_provenance_record
        output: provenance_sidecar
  - id: ask-watch-review
    name: Ask a saved Watch review
    steps:
      - capability: query_evidence_timeline
        tool: watch-skill
        output: timestamped_evidence_answer
      - capability: create_provenance_record
        optional: true
        output: provenance_sidecar
  - id: assess-watch-review
    name: Assess a saved Watch review
    steps:
      - capability: assess_asset_evidence
        tool: watch-skill
        output: evidence_based_assessment
      - capability: create_provenance_record
        output: provenance_sidecar
  - id: verify-ui-tutorial
    name: Verify a saved software or UI tutorial
    steps:
      - capability: verify_ui_tutorial_steps
        tool: watch-skill
        output: ordered_step_review
      - capability: create_provenance_record
        output: provenance_sidecar
  - id: review-gameplay
    name: Review a saved gameplay recording
    steps:
      - capability: review_gameplay_events
        tool: watch-skill
        output: ordered_gameplay_review
      - capability: create_provenance_record
        output: provenance_sidecar
  - id: convert-3d-asset
    name: Convert a local 3D asset with Blender
    steps:
      - capability: convert_3d_format
        tool: blender
        output: local_3d_derivative
      - capability: create_provenance_record
        output: provenance_sidecar
  - id: preflight-3d-asset
    name: Preflight and preview a local 3D asset
    steps:
      - capability: preflight_3d_asset
        tool: blender
        output: scene_readiness_report
      - capability: render_3d_preview
        tool: blender
        optional: true
        output: local_preview_image
      - capability: inspect_3d_render
        tool: local-visual-analysis
        optional: true
        output: local_visual_comparison
      - capability: create_provenance_record
        output: provenance_sidecar
  - id: local-text-to-speech
    name: Create local spoken audio
    steps:
      - capability: text_to_speech
        tool: windows-sapi-tts
        output: local_wav_derivative
      - capability: create_provenance_record
        output: provenance_sidecar
  - id: asset-source-research
    name: Research a local asset source catalog
    steps:
      - capability: search_assets
        output: license_aware_source_brief
      - capability: evaluate_license
        output: review_requirements
  - id: prepare-image-asset
    name: Prepare a local image asset
    steps:
      - capability: prepare_image
        tool: pillow-image-prep
        output: image_derivative
      - capability: create_provenance_record
        output: provenance_sidecar
  - id: clean-local-audio
    name: Clean a local audio derivative
    steps:
      - capability: clean_audio
        tool: ffmpeg
        output: cleaned_audio_derivative
      - capability: create_provenance_record
        output: provenance_sidecar
  - id: inspect-game-asset
    name: Inspect local game asset readiness
    steps:
      - capability: inspect_game_asset
        tool: blender
        output: game_asset_readiness_report
      - capability: create_provenance_record
        optional: true
        output: provenance_sidecar
  - id: create-local-lod
    name: Create a local Blender LOD derivative
    steps:
      - capability: generate_lod
        tool: blender
        output: lod_blend_derivative
      - capability: create_provenance_record
        output: provenance_sidecar
  - id: music-and-sfx-research
    name: Research local music and sound-effect generation
    steps:
      - capability: choose_tool
        output: review_only_generation_brief
      - capability: evaluate_license
        output: approval_requirements
