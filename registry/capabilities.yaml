capabilities:
  - id: watch_video
    name: Watch video
    description: Acquire, perceive, transcribe, and answer questions about video evidence.
  - id: transcribe_audio
    name: Transcribe audio
    description: Produce timestamped speech from local audio or video.
  - id: detect_scenes
    name: Detect scenes
    description: Identify distinct visual moments and representative frames.
  - id: understand_video
    name: Understand video
    description: Answer evidence-grounded questions about video content.
  - id: visual_qa
    name: Visual QA
    description: Compare captures or rendered assets against acceptance criteria.
  - id: text_to_speech
    name: Text to speech
    description: Render text as spoken audio.
  - id: normalize_media
    name: Normalize media
    description: Inspect and transform media streams without replacing originals.
  - id: create_provenance_record
    name: Create provenance record
    description: Record the tools and source assets used to create a derivative.
  - id: create_evidence_timeline
    name: Create evidence timeline
    description: Produce a versioned, timestamped JSON timeline from locally reviewed media.
  - id: query_evidence_timeline
    name: Query evidence timeline
    description: Retrieve timestamped transcript or OCR evidence from a saved local Watch timeline.
  - id: assess_asset_evidence
    name: Assess asset evidence
    description: Evaluate explicit acceptance criteria against saved local transcript or OCR evidence.
  - id: verify_ui_tutorial_steps
    name: Verify UI tutorial steps
    description: Check an ordered software or UI tutorial checklist against saved local transcript or OCR evidence.
  - id: review_gameplay_events
    name: Review gameplay events
    description: Check expected gameplay events and sequence against saved local transcript or OCR evidence.
  - id: search_evidence_library
    name: Search evidence library
    description: Search across saved local Watch evidence timelines without reprocessing media.
  - id: inspect_3d_asset
    name: Inspect 3D asset
    description: Report local Blender scene counts for a .blend asset without modifying it.
  - id: model_3d
    name: Model 3D
    description: Create and edit 3D models locally.
  - id: convert_3d_format
    name: Convert 3D format
    description: Convert supported 3D asset formats.
  - id: generate_music
    name: Generate music
    description: Generate local music with an explicitly installed and hardware-gated model.
  - id: optimize_gltf
    name: Optimize glTF asset
    description: Create a separate locally optimized GLB derivative for engine shipping review.
