capabilities:
  - id: watch_video
    name: Watch video
    description: Acquire, perceive, transcribe, and answer questions about video evidence.
  - id: transcribe_audio
    name: Transcribe audio
    description: Produce timestamped speech from local audio or video.
  - id: detect_scenes
    name: Detect scenes
    description: Identify distinct visual moments and representative frames.
  - id: understand_video
    name: Understand video
    description: Answer evidence-grounded questions about video content.
  - id: visual_qa
    name: Visual QA
    description: Compare captures or rendered assets against acceptance criteria.
  - id: text_to_speech
    name: Text to speech
    description: Render text as spoken audio.
  - id: normalize_media
    name: Normalize media
    description: Inspect and transform media streams without replacing originals.
  - id: create_provenance_record
    name: Create provenance record
    description: Record the tools and source assets used to create a derivative.
  - id: create_evidence_timeline
    name: Create evidence timeline
    description: Produce a versioned, timestamped JSON timeline from locally reviewed media.
  - id: query_evidence_timeline
    name: Query evidence timeline
    description: Retrieve timestamped transcript or OCR evidence from a saved local Watch timeline.
  - id: assess_asset_evidence
    name: Assess asset evidence
    description: Evaluate explicit acceptance criteria against saved local transcript or OCR evidence.
  - id: verify_ui_tutorial_steps
    name: Verify UI tutorial steps
    description: Check an ordered software or UI tutorial checklist against saved local transcript or OCR evidence.
  - id: review_gameplay_events
    name: Review gameplay events
    description: Check expected gameplay events and sequence against saved local transcript or OCR evidence.
  - id: search_evidence_library
    name: Search evidence library
    description: Search across saved local Watch evidence timelines without reprocessing media.
  - id: inspect_3d_asset
    name: Inspect 3D asset
    description: Report local Blender scene counts for a .blend asset without modifying it.
  - id: model_3d
    name: Model 3D
    description: Create and edit 3D models locally.
  - id: convert_3d_format
    name: Convert 3D format
    description: Convert supported 3D asset formats.
  - id: compare_visuals
    name: Compare visuals
    description: Compare local images using pixel and perceptual features without uploading them.
  - id: understand_image
    name: Understand image
    description: Interpret a still image with a separately reviewed local vision model.
  - id: inspect_3d_render
    name: Inspect 3D render
    description: Assess local render differences and scene readiness before asset handoff.
  - id: preflight_3d_asset
    name: Preflight 3D asset
    description: Detect missing linked images and scene setup issues in a local Blender file.
  - id: render_3d_preview
    name: Render 3D preview
    description: Produce a bounded local preview render without changing the source Blender file.
  - id: control_blender
    name: Control Blender
    description: Invoke guarded, local Blender operations through the Toolbox CLI.
  - id: choose_tool
    name: Choose tool
    description: Return deterministic local routing advice or a review-only capability gap.
  - id: search_assets
    name: Search assets
    description: Search a curated local catalog of asset sources without downloading from them.
  - id: evaluate_license
    name: Evaluate license
    description: Surface source and per-asset license-review requirements before acquisition.
  - id: prepare_image
    name: Prepare image
    description: Create a non-destructive local image derivative with format, size, and alpha handling.
  - id: upscale_image
    name: Upscale image
    description: Resize a local image with high-quality interpolation without inventing image detail.
  - id: clean_audio
    name: Clean audio
    description: Create a local trimmed and loudness-normalized audio derivative.
  - id: inspect_game_asset
    name: Inspect game asset
    description: Report UV, mesh, collision-name, and LOD-name readiness evidence from a Blender asset.
  - id: generate_lod
    name: Generate LOD
    description: Create a source-preserving local Blender decimate LOD derivative.
  - id: generate_music
    name: Generate music
    description: Create music from a separately approved local generation model.
  - id: generate_sfx
    name: Generate sound effects
    description: Create sound effects from a separately approved local generation model.
